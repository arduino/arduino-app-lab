# See: https://taskfile.dev/#/usage
version: "3"

tasks:
  # Source: https://github.com/arduino/tooling-project-assets/blob/main/workflow-templates/assets/check-dependencies-task/Taskfile.yml
  general:cache-dep-licenses:
    desc: Cache dependency license metadata
    deps:
      - task: general:check-licensed
      - task: general:prepare-deps
    cmds:
      # Pin GOOS/GOARCH to the canonical CI target so `go list` enumerates the
      # same dependency set on every machine (a Mac otherwise resolves
      # platform-specific build-constrained imports and drifts the cache).
      - GOOS=linux GOARCH=amd64 licensed cache
      # The cache above is a compliance gate that never reaches users. This turns
      # it into the attribution App Lab actually ships. Running it here means the
      # check-cache CI job, which regenerates this task and fails on any git diff,
      # also catches a stale notice.
      - ./dev-utils/al-license/generate_dependency_notices.sh

  # Source: https://github.com/arduino/tooling-project-assets/blob/main/workflow-templates/assets/check-dependencies-task/Taskfile.yml
  general:check-dep-licenses:
    desc: Check for unapproved dependency licenses
    deps:
      - task: general:cache-dep-licenses
    cmds:
      - |
        MATCHES="$(
          find \
            .licenses \
            -regex '.+\.yml' \
            -type f \
            -print0 \
          | \
            xargs \
              --null \
              go tool \
                github.com/mikefarah/yq/v4 \
                  'select(.license == "other") | filename'
        )"
        if [[ "$MATCHES" != "" ]]; then
          printf "%s" "$MATCHES"
          echo
          echo "The license cache files above have the license set to 'other'. Please manually define the license type and retry."
          echo "See: https://github.com/arduino/tooling-project-assets/blob/main/workflow-templates/check-go-dependencies-task.md#unrecognized-licenses"
          exit 1
        fi
      # Same Linux/amd64 pin as `licensed cache`: status re-enumerates from the
      # live tree, so without it a Mac flags the Linux-only records as stale.
      - GOOS=linux GOARCH=amd64 licensed status

  general:check-licensed:
    desc: Install licensed in the .licensed folder
    status:
      - licensed version
    cmds:
      - |
        if [[ {{OS}} == "windows" ]]; then
          echo "Licensed does not have Windows support."
          echo "Please use Linux/macOS or download the dependencies cache from the GitHub Actions workflow artifact."
          exit 1
        fi
      - |
        echo "Run 'sudo gem install licensed' to install licensed."
        exit 1

  general:prepare-deps:
    desc: Prepare project dependencies for license check
    deps:
      - task: yarn:install-deps

  yarn:install-deps:
    desc: |
      Install dependencies managed by npm/yarn.
    run: when_changed
    cmds:
      - yarn
